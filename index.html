<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supra Ervas - TV Líquidos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ==== Paleta Líquidos (espectro do líquido, tom TV/kiosk) ==== */
  --hall:#FFC94D;      --hall-bg:#241E10;
  --et1:#3ED6FF;       --et1-bg:#0F2226;   /* Fracionamento/Separação/Pesagem */
  --et2:#B57BFF;       --et2-bg:#1E1428;   /* Mistura em Tanques */
  --et3:#FF9645;       --et3-bg:#241708;   /* Envase */
  --et4:#FFE066;       --et4-bg:#242010;   /* Rotulagem */
  --et5:#62E39B;       --et5-bg:#0F2419;   /* Embalagem */
  --final:#8CFF6F;     --final-bg:#12241A;
  --vermelho:#FF5A5A;
  --cinza-900:#EAF3EC; --cinza-600:#A9BBB0; --cinza-400:#75897E;
  --cinza-200:#26332B; --cinza-100:#131A15;
  --preto:#0A0D0B;     --preto-2:#050705;  --painel:#111814;
  --sombra: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
  --glow-hall: 0 0 14px rgba(255,201,77,.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:var(--preto-2);color:var(--cinza-900);font-family:'Rajdhani',Roboto,Arial,sans-serif;overflow:hidden;}
h1,h2,h3,.op-num,.pilula,.rotulo,.etapa-titulo{font-family:'Oswald',Arial,sans-serif;}

.tv{width:100vw;height:100vh;display:flex;flex-direction:column;padding:1.3vh 1.5vw;gap:.9vh;}

.cabecalho{display:flex;align-items:center;justify-content:space-between;padding-bottom:1.3vh;border-bottom:2px solid var(--hall);flex:none;gap:1vw;flex-wrap:wrap;}
.marca{display:flex;align-items:center;gap:1vw;}
.marca .selo{width:5.2vh;height:5.2vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--hall),#B8891E 70%);display:flex;align-items:center;justify-content:center;font-size:2.6vh;box-shadow:var(--glow-hall);flex:none;}
.marca h1{font-size:2.6vh;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#fff;text-shadow:0 0 10px rgba(255,201,77,.3);}
.marca p{font-size:1.5vh;color:var(--hall);letter-spacing:.2px;margin-top:.15vh;}
.status-vivo{display:flex;align-items:center;gap:.5vw;font-size:1.4vh;color:var(--cinza-400);font-weight:600;letter-spacing:.04em;text-transform:uppercase;flex:none;}
.pulso{width:1.2vh;height:1.2vh;border-radius:50%;background:var(--final);box-shadow:0 0 8px var(--final);animation:pulso 2s infinite;}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(140,255,111,.55);}70%{box-shadow:0 0 0 1vh rgba(140,255,111,0);}100%{box-shadow:0 0 0 0 rgba(140,255,111,0);}}

.ferramentas{display:flex;align-items:center;gap:.6vw;flex:none;}
.ferr-btn{
  display:flex;align-items:center;gap:.4vw;background:var(--painel);border:2px solid var(--cinza-200);
  border-radius:2vh;padding:.5vh 1vw;cursor:pointer;color:var(--cinza-900);font-family:'Oswald',Arial,sans-serif;
  font-size:1.35vh;font-weight:700;text-transform:uppercase;letter-spacing:.3px;transition:.15s;white-space:nowrap;
}
.ferr-btn:hover{border-color:var(--hall);color:var(--hall);}
.ferr-btn.destaque{background:var(--hall);color:#241705;border-color:var(--hall);}
.ferr-btn.destaque:hover{filter:brightness(1.08);color:#241705;}
#arquivoInput{display:none;}
.upload-status{font-size:1.1vh;color:var(--cinza-400);max-width:16vw;}

.qr-apontamento{
  display:flex;flex-direction:column;align-items:center;gap:.3vh;
  background:#fff;border-radius:.8vh;padding:.5vh .6vw;
  box-shadow:0 0 0 2px var(--hall), var(--glow-hall);flex:none;
}
.qr-apontamento #qrApontamento{line-height:0;}
.qr-apontamento #qrApontamento img,.qr-apontamento #qrApontamento canvas{width:6vh;height:6vh;display:block;}
.qr-legenda{font-size:.85vh;font-weight:800;color:#241705;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}

.relogio{text-align:right;flex:none;}
.relogio .hora{font-family:'Oswald';font-size:3.1vh;font-weight:700;color:var(--cinza-900);line-height:1;font-variant-numeric:tabular-nums;}
.relogio .data{font-size:1.35vh;color:var(--cinza-400);margin-top:.2vh;text-transform:capitalize;}

/* ===== PIPELINE BAR ===== */
.pipeline-bar{display:flex;align-items:center;justify-content:center;gap:.5vw;flex-wrap:wrap;flex:none;}
.pilula{
  display:flex;align-items:center;gap:.4vw;padding:.4vh .9vw;border-radius:2vh;
  font-size:1.1vh;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
  border:2px solid var(--cor-pilula);color:var(--cor-pilula);background:var(--bg-pilula);white-space:nowrap;
}
.pilula .n{background:rgba(255,255,255,.1);border-radius:1.6vh;padding:.05vh .8vh;font-size:1.1vh;margin-left:.2vw;}
.pilula-seta{color:#3a453d;font-size:1.2vh;}

/* ===== DASHBOARD OEE ===== */
.oee-painel{flex:none;background:var(--painel);border:1px solid var(--cinza-200);border-radius:.7vh;padding:.35vh .8vw .3vh;}
.oee-painel-titulo{font-size:1vh;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--cinza-600);margin-bottom:.2vh;display:flex;align-items:center;gap:.3vw;}
.oee-linha{display:flex;align-items:center;gap:.6vw;margin-bottom:.2vh;}
.oee-linha:last-child{margin-bottom:0;}
.oee-linha-rotulo{font-size:.8vh;font-weight:800;color:var(--cinza-400);text-transform:uppercase;letter-spacing:.05em;width:6vw;flex:none;}
.oee-linha-cards{display:flex;gap:.35vw;flex:1;}
.gauge-card{background:var(--cinza-100);border:1px solid var(--cinza-200);border-radius:.4vh;padding:.1vh .15vh .15vh;text-align:center;width:4.2vw;flex:none;}
.gauge-card svg{width:100%;display:block;}
.gauge-titulo{font-size:.68vh;font-weight:800;color:var(--cinza-400);text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ===== FILTRO DE BUSCA ===== */
.filtro-banner{display:none;align-items:center;justify-content:space-between;gap:1vw;background:var(--painel);border:2px solid var(--cor-status,var(--hall));border-radius:1vh;padding:.7vh 1.2vw;flex:none;}
.filtro-banner.ativo{display:flex;}
.filtro-banner .texto{font-family:'Oswald',Arial,sans-serif;font-weight:600;font-size:1.6vh;color:var(--cinza-900);letter-spacing:.2px;}
.filtro-banner .texto b{color:var(--cor-status,var(--hall));}
.filtro-limpar{background:var(--cinza-200);border:none;border-radius:1.8vh;padding:.5vh 1.2vw;font-family:'Oswald',Arial,sans-serif;font-weight:700;font-size:1.25vh;text-transform:uppercase;letter-spacing:.3px;color:var(--cinza-900);cursor:pointer;flex:none;transition:.15s;}
.filtro-limpar:hover{background:var(--vermelho);color:#fff;}

/* ===== BOARD ===== */
.corpo{flex:1;display:flex;min-height:0;}
.board{flex:1;display:grid;gap:.6vw;min-height:0;
  grid-template-columns: minmax(0,1fr) minmax(0,1.25fr) minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);
}
.coluna-dupla{display:flex;flex-direction:column;gap:.6vh;min-height:0;}
.coluna-dupla .coluna{flex:1;min-height:0;}

.coluna{background:var(--cinza-100);border:1px solid var(--cinza-200);border-radius:.9vh;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:visible;position:relative;margin-top:3.6vh;}
.coluna-dupla .coluna:first-child{margin-top:3.6vh;}
.coluna > .lista{overflow-y:auto;border-radius:0 0 .9vh .9vh;}

.coluna-pill{
  position:absolute;top:-3.4vh;left:50%;transform:translateX(-50%);z-index:3;
  display:flex;align-items:center;gap:.4vw;padding:.5vh 1.2vw;border-radius:2.4vh;
  font-size:1.6vh;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
  border:2px solid var(--cor-pilula);color:var(--cor-pilula);background:var(--bg-pilula);
  white-space:nowrap;box-shadow:0 .3vh 1vh rgba(0,0,0,.5);
}
.coluna-pill .n{background:rgba(255,255,255,.12);border-radius:1.6vh;padding:.05vh .9vh;font-size:1.45vh;margin-left:.15vw;color:var(--cinza-900);}
.coluna-pill .sub{font-size:1vh;opacity:.75;margin-left:.3vw;font-weight:500;}

.lista{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.4vh;min-height:4vh;padding:.6vh .55vw;scrollbar-width:none;}
.lista::-webkit-scrollbar{display:none;}
.item{
  background:var(--preto);border:1px solid var(--cinza-200);border-left:3px solid var(--cor-item);border-radius:.6vh;
  padding:.5vh .6vw;display:flex;flex-direction:column;gap:.2vh;flex:none;cursor:pointer;transition:.12s;
}
.item:hover{border-left-width:4px;}
.item.com-parada-ativa{border-color:var(--vermelho);box-shadow:0 0 0 1px rgba(255,90,90,.35), 0 0 10px rgba(255,90,90,.2);}
.item .linha1{display:flex;justify-content:space-between;gap:.5vw;align-items:baseline;}
.item .op{font-size:1.5vh;font-weight:700;color:var(--cor-item);white-space:nowrap;font-family:'Oswald';}
.item .data-emissao{font-size:1.05vh;color:var(--cinza-400);white-space:nowrap;}
.item .nome{font-size:1.55vh;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--cinza-900);line-height:1.25;}
.item .meta{display:flex;justify-content:space-between;font-size:1.1vh;color:var(--cinza-600);margin-top:.1vh;}
.item .meta b{color:var(--cinza-900);}
.badge-etapa-real{display:inline-block;font-size:1vh;font-weight:800;padding:.1vh .8vh;border-radius:999px;color:#0A140D;font-family:'Rajdhani';width:fit-content;}
.vazio{flex:1;display:flex;align-items:center;justify-content:center;color:var(--cinza-400);font-size:1.15vh;text-align:center;padding:1vh;}

/* Nível de garrafa */
.nivel-garrafa{margin-top:.15vh;}
.nivel-legenda{display:flex;justify-content:space-between;font-size:.95vh;color:var(--cinza-400);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.1vh;font-weight:700;}
.nivel-trilho{height:.6vh;border-radius:999px;background:var(--cinza-200);overflow:hidden;}
.nivel-liquido{height:100%;border-radius:999px;}

/* Badges de parada ativa (igual Monster) */
.badge-parada-ativa{
  font-size:1.2vh;font-weight:800;padding:.25vh .6vw;border-radius:.5vh;display:flex;align-items:center;gap:.35vw;letter-spacing:.1px;margin-top:.15vh;
  background:rgba(255,90,90,.16);color:var(--vermelho);border:1px solid var(--vermelho);
  animation:pulsoParada 1.6s infinite;
}
.badge-parada-ativa .triangulo{font-size:1.4vh;line-height:1;flex:none;}
@keyframes pulsoParada{0%{box-shadow:0 0 0 0 rgba(255,90,90,.45);}70%{box-shadow:0 0 0 .8vh rgba(255,90,90,0);}100%{box-shadow:0 0 0 0 rgba(255,90,90,0);}}

/* Botões dos cards */
.btn{width:100%;border:none;border-radius:.6vh;padding:.5vh .6vw;font-size:1.2vh;font-weight:700;cursor:pointer;transition:.15s;text-align:center;text-decoration:none;display:block;box-sizing:border-box;letter-spacing:.02em;margin-top:.3vh;}
.btn-avancar{background:var(--hall);color:#241705;}
.btn-avancar:hover{box-shadow:var(--glow-hall);}
.btn-registrar{color:#0A140D;}
.btn-registrar:hover{filter:brightness(1.1);}
.btn-devolver{width:100%;border:1.5px solid var(--cinza-200);border-radius:.6vh;padding:.4vh .6vw;font-size:1.05vh;font-weight:600;cursor:pointer;background:transparent;color:var(--cinza-600);margin-top:.25vh;}
.btn-devolver:hover{border-color:var(--hall);color:var(--hall);}
.tag-concluida{display:inline-flex;align-items:center;gap:.25vw;background:rgba(140,255,111,.14);color:var(--final);font-size:1.05vh;font-weight:800;padding:.2vh .7vh;border-radius:999px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--hall);color:#241705;padding:12px 20px;border-radius:9px;font-size:13px;font-weight:700;box-shadow:var(--glow-hall);display:none;z-index:100;}

/* ===== MODAIS (ficha + busca) ===== */
.overlay-ficha,.overlay-busca{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:200;}
.overlay-ficha.ativo,.overlay-busca.ativo{display:flex;}
.modal-ficha{background:var(--painel);border:1px solid var(--hall);border-radius:16px;max-width:780px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.6), var(--glow-hall);font-size:15px;}
.ficha-topo{padding:20px 26px;border-bottom:2px solid var(--hall);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;position:sticky;top:0;background:var(--painel);border-radius:16px 16px 0 0;}
.ficha-topo .marca-ficha{font-size:18px;font-weight:800;color:var(--hall);text-transform:uppercase;letter-spacing:.4px;font-family:'Oswald';}
.ficha-topo .subtitulo{font-size:11px;color:var(--cinza-400);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:2px;}
.ficha-topo .op-box{text-align:right;}
.ficha-topo .op-box .rotulo{font-size:10.5px;color:var(--cinza-400);text-transform:uppercase;font-weight:700;}
.ficha-topo .op-box .valor{font-size:22px;font-weight:800;font-family:Consolas,monospace;color:var(--cinza-900);}
.ficha-fechar{background:var(--cinza-200);border:none;border-radius:8px;width:30px;height:30px;font-size:15px;cursor:pointer;color:var(--cinza-900);}
.ficha-info{padding:18px 26px;border-bottom:1px solid var(--cinza-200);}
.ficha-grid-info{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:640px){.ficha-grid-info{grid-template-columns:repeat(2,1fr);}}
.ficha-campo .rotulo{font-size:10px;color:var(--cinza-400);text-transform:uppercase;font-weight:700;margin-bottom:2px;}
.ficha-campo .valor{font-size:13.5px;font-weight:600;color:var(--cinza-900);}
.ficha-produto{padding:16px 26px;background:rgba(255,201,77,.08);border-bottom:1px solid var(--cinza-200);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
.ficha-produto .nome{font-size:15px;font-weight:800;color:var(--cinza-900);}
.ficha-produto .grupo{font-size:11px;color:var(--hall);font-weight:600;margin-top:2px;}
.ficha-produto .qtde-valor{font-size:20px;font-weight:800;color:var(--hall);text-align:right;}
.ficha-produto .qtde-rotulo{font-size:10px;color:var(--cinza-400);text-transform:uppercase;font-weight:700;text-align:right;}
.ficha-materiais{padding:18px 26px 26px;}
.ficha-materiais h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--cinza-600);margin:0 0 12px;font-weight:700;}
.ficha-grupo{margin-bottom:16px;}
.ficha-grupo .titulo-grupo{font-size:11px;font-weight:700;color:var(--et1);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;padding-bottom:5px;border-bottom:1.5px solid var(--cinza-200);}
table.ficha-tabela{width:100%;border-collapse:collapse;font-size:12.5px;}
table.ficha-tabela th{text-align:left;font-size:10px;color:var(--cinza-400);text-transform:uppercase;font-weight:700;padding:5px 7px;border-bottom:1px solid var(--cinza-200);}
table.ficha-tabela td{padding:7px 7px;border-bottom:1px solid var(--cinza-200);color:var(--cinza-900);}
table.ficha-tabela td.num{text-align:right;font-family:Consolas,monospace;}
.ficha-aviso{padding:50px 30px;text-align:center;color:var(--cinza-400);}

.modal-busca{background:var(--painel);border:1px solid var(--hall);border-radius:16px;max-width:760px;width:100%;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6),var(--glow-hall);overflow:hidden;}
.busca-topo{padding:18px 22px;border-bottom:2px solid var(--hall);display:flex;align-items:center;gap:12px;flex:none;}
.busca-input{flex:1;background:var(--preto);border:1px solid var(--cinza-200);border-radius:10px;padding:12px 16px;font-family:'Rajdhani',Arial,sans-serif;font-size:16px;font-weight:600;color:var(--cinza-900);outline:none;}
.busca-input::placeholder{color:var(--cinza-400);}
.busca-input:focus{border-color:var(--hall);}
.busca-fechar{background:var(--cinza-200);border:none;border-radius:8px;width:34px;height:34px;font-size:15px;cursor:pointer;color:var(--cinza-900);flex:none;}
.busca-resultados{overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:8px;}
.busca-vazio{padding:40px 20px;text-align:center;color:var(--cinza-400);font-size:14px;}
.busca-contador{padding:10px 22px 0;font-size:11px;color:var(--cinza-400);text-transform:uppercase;letter-spacing:.05em;font-weight:700;flex:none;}
.busca-item{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--preto);border:1px solid var(--cinza-200);border-left:4px solid var(--cor-status);border-radius:10px;padding:12px 16px;cursor:pointer;transition:.12s;}
.busca-item:hover{border-left-width:6px;transform:translateX(2px);}
.busca-item .info{min-width:0;}
.busca-item .op-nome{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.busca-item .op-num{font-family:'Oswald',Arial,sans-serif;font-weight:700;font-size:14px;color:var(--cor-status);white-space:nowrap;}
.busca-item .nome{font-size:14.5px;font-weight:600;color:var(--cinza-900);}
.busca-item .linha-info{font-size:11px;color:var(--cinza-400);margin-top:3px;text-transform:uppercase;letter-spacing:.03em;font-weight:600;}
.busca-badge{flex:none;font-size:10.5px;font-weight:800;padding:5px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;color:var(--cor-status);background:var(--bg-status);border:1px solid var(--cor-status);white-space:nowrap;}
</style>
</head>
<body>

<div class="tv">

  <div class="cabecalho">
    <div class="marca">
      <div class="selo">🌿</div>
      <div>
        <h1>TV Líquidos</h1>
        <p id="subtituloEtapas">Carregando etapas...</p>
      </div>
    </div>
    <div class="status-vivo"><span class="pulso"></span> Dados ao vivo</div>
    <div class="ferramentas">
      <button class="ferr-btn" onclick="abrirBusca()">🔎 Buscar OP</button>
      <label class="ferr-btn" for="arquivoInput">📤 Importar Relatório</label>
      <input type="file" id="arquivoInput" accept=".csv,.xlsx,.xls" onchange="importarArquivo(event)">
      <button class="ferr-btn" onclick="carregarDoSheet()">🔄 Atualizar</button>
      <span class="upload-status" id="uploadStatus"></span>
    </div>
    <div class="qr-apontamento">
      <div id="qrApontamento"></div>
      <span class="qr-legenda">📱 Apontar Produção</span>
    </div>
    <div class="relogio">
      <div class="hora" id="relogioHora">--:--</div>
      <div class="data" id="relogioData">carregando...</div>
    </div>
  </div>

  <div class="pipeline-bar" id="pipelineBar"></div>

  <div class="oee-painel">
    <div class="oee-painel-titulo">📊 OEE por Etapa</div>
    <div class="oee-linha">
      <div class="oee-linha-rotulo">Média 7 dias</div>
      <div class="oee-linha-cards" id="oeeLinhaMedia"></div>
    </div>
    <div class="oee-linha">
      <div class="oee-linha-rotulo">Hoje</div>
      <div class="oee-linha-cards" id="oeeLinhaHoje"></div>
    </div>
  </div>

  <div class="filtro-banner" id="filtroBanner">
    <span class="texto" id="filtroTexto"></span>
    <button class="filtro-limpar" onclick="limparFiltro()">✕ Limpar filtro — mostrar tudo</button>
  </div>

  <div class="corpo">
    <div class="board" id="boardScroll"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="overlay-ficha" id="overlayFicha" onclick="if(event.target===this) fecharFicha()">
  <div class="modal-ficha"><div id="conteudoFicha"></div></div>
</div>

<div class="overlay-busca" id="overlayBusca" onclick="if(event.target===this) fecharBusca()">
  <div class="modal-busca">

</div>

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxlmYUWNLX0gtiV3dAfPw1G1vZt9IVru_0cZhg9o_QP-OUmmFMFTQqg7vPGK5f_GSw4/exec';
const FORM_URL   = 'https://supraervas2-lgtm.github.io/formulario-liquidos/';

let hall = [], emProducao = [], finalizadas = [], detalhesOP = {}, oeeStats = { medio7dias:[], hoje:[] };
let etapasGrupos = [
  ['Fracionamento','Separação','Pesagem'],
  ['Mistura em Tanques'],
  ['Envase'],
  ['Rotulagem'],
  ['Embalagem']
];
const ICONE_GRUPO = ['⚖️','🌀','🧴','🏷️','📦'];
const COR_GRUPO   = ['var(--et1)','var(--et2)','var(--et3)','var(--et4)','var(--et5)'];
const COR_GRUPO_HEX = ['#3ED6FF','#B57BFF','#FF9645','#FFE066','#62E39B'];
const COR_GRUPO_BG_HEX = ['#0F2226','#1E1428','#241708','#242010','#0F2419'];

let catalogo = [];      // catálogo global pra busca (hall + em produção + finalizadas)
let filtroAtivo = null; // { op, nome, status, corStatus }

/* ── Utilidades ── */
function normalizar(txt){ return String(txt||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function limparTexto(v){ if(v===null||v===undefined) return ''; return String(v).trim().replace(/^"+|"+$/g,'').trim(); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return String(s??'').replace(/'/g,"\\'"); }
function indiceDoGrupo(etapaAtual){
  for(let i=0;i<etapasGrupos.length;i++){ if(etapasGrupos[i].includes(etapaAtual)) return i; }
  return -1;
}
function rotuloGrupo(i){ return etapasGrupos[i] ? etapasGrupos[i][0] : ''; }

/* ── Relógio ── */
function atualizarRelogio(){
  const agora = new Date();
  document.getElementById('relogioHora').textContent = agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('relogioData').textContent = agora.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
}
atualizarRelogio();
setInterval(atualizarRelogio, 1000);

/* ── QR de apontamento ── */
new QRCode(document.getElementById("qrApontamento"), {
  text: FORM_URL,
  width: 120, height: 120,
  colorDark: "#0A0D0B", colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.M
});

/* ── Parada ativa: motivo + tempo decorrido (mesma lógica do TV Monster) ── */
function parseDataHoraBR(str){
  if(!str) return null;
  const m = String(str).match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if(!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]);
}
function tempoDecorridoTexto(dataHoraStr){
  const d = parseDataHoraBR(dataHoraStr);
  if(!d) return null;
  const diffMs = Date.now() - d.getTime();
  if(diffMs < 0) return 'agora';
  const totalMin = Math.floor(diffMs/60000);
  const h = Math.floor(totalMin/60);
  const m = totalMin % 60;
  return h > 0 ? `${h}h ${m}min` : `${m}min`;
}
function blocoParadaAtiva(motivo, registradaEm){
  if(!motivo) return '';
  const decorrido = registradaEm ? tempoDecorridoTexto(registradaEm) : null;
  return `<div class="badge-parada-ativa"><span class="triangulo">⚠️</span> ${escapeHtml(motivo)}${decorrido ? ` · há ${decorrido}` : ''}</div>`;
}

/* ── Carregar dados ── */
async function carregarDoSheet(){
  try{
    const resp = await fetch(SHEETS_URL + '?t=' + Date.now(), { cache:'no-store' });
    const data = await resp.json();
    if(data.status === 'ok'){
      hall        = data.hall       || [];
      emProducao  = data.emProducao || [];
      finalizadas = data.finalizadas|| [];
      detalhesOP  = data.detalhes   || {};
      oeeStats    = data.oeeStats   || { medio7dias:[], hoje:[] };
      if(data.etapasGrupos && data.etapasGrupos.length) etapasGrupos = data.etapasGrupos;
      document.getElementById('subtituloEtapas').textContent =
        'Hall → ' + etapasGrupos.map(g=>g[0]).join(' → ') + ' → Finalizadas · dados em tempo real';
      renderTudo();
    }
  } catch(e){
    console.error(e);
    document.getElementById('boardScroll').innerHTML = '<div class="vazio">⚠️ Sem conexão</div>';
  }
}

async function postAcao(body){
  await fetch(SHEETS_URL, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
}

/* ══════════════════════════════════════════════════════════
   IMPORTAÇÃO DO RELATÓRIO (mesma lógica do Apps Script)
   ══════════════════════════════════════════════════════════ */
const GRUPO_PRODUTO_ALVO    = 'Produtos Acabados de Linha';
const SUBGRUPO_PRODUTO_ALVO = 'P.A. Líquidos';

function validarColunasRelatorio(headerRow){
  const norm = headerRow.map(h=>normalizar(h));
  return ['empresa','codigo','grupo produto','subgrupo produto'].every(c=>norm.includes(c));
}
function extrairDoRelatorioOP(rows){
  const header = rows[0].map(h=>normalizar(h));
  const idx = n => header.indexOf(normalizar(n));
  const iSituacao=idx('situacao'),iEmpresa=idx('empresa'),iCodigo=idx('codigo'),iData=idx('data'),
        iQtde=idx('quantidade'),iCodProduto=idx('cod. produto'),iDescricao=idx('descricao'),
        iGrupoProduto=idx('grupo produto'),iSubgrupoProduto=idx('subgrupo produto');
  const vistos=new Set(), novas=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(!r||!r[iCodigo]) continue;
    if(!normalizar(r[iSituacao]).includes('nao finalizad')) continue;
    if(String(r[iEmpresa]).trim()!=='2') continue;
    if(normalizar(r[iGrupoProduto])!==normalizar(GRUPO_PRODUTO_ALVO)) continue;
    if(normalizar(r[iSubgrupoProduto])!==normalizar(SUBGRUPO_PRODUTO_ALVO)) continue;
    const codigo=limparTexto(r[iCodigo]);
    if(!codigo||vistos.has(codigo)) continue;
    vistos.add(codigo);
    novas.push({ op:codigo, dataEmissao:limparTexto(r[iData]), codProduto:String(r[iCodProduto]??'').trim(),
      descricao:limparTexto(r[iDescricao]), qtde:String(r[iQtde]??'').trim(), cliente:'', familia:'' });
  }
  return novas;
}
async function importarArquivo(event){
  const file=event.target.files[0];
  if(!file) return;
  const status=document.getElementById('uploadStatus');
  status.textContent='Lendo '+file.name+'...';
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array',cellDates:true});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1,raw:false,dateNF:'dd/mm/yyyy'});
      if(rows.length<2){ status.textContent='⚠️ Arquivo vazio.'; return; }
      if(!validarColunasRelatorio(rows[0])){ status.textContent='⚠️ Arquivo inválido.'; return; }
      const existentes=new Set([...hall,...emProducao,...finalizadas].map(o=>limparTexto(o.op)));
      const novasOps=extrairDoRelatorioOP(rows).filter(o=>o.op&&!existentes.has(o.op));
      if(novasOps.length===0){ status.textContent='Nenhuma OP nova encontrada.'; return; }
      status.textContent=`Enviando ${novasOps.length} OP(s)...`;
      await postAcao({ acao:'importar_hall', ops:novasOps });
      status.textContent=`✅ ${novasOps.length} OP(s) importada(s).`;
      carregarDoSheet();
    }catch(err){ console.error(err); status.textContent='⚠️ Erro ao ler arquivo.'; }
  };
  reader.readAsArrayBuffer(file);
  event.target.value='';
}

/* ── Ações ── */

  mostrarToast('▶ Movendo para produção...');
  await postAcao({ acao:'iniciar_producao', op:opNum });

}

  setTimeout(()=>t.style.display='none',2500);
}

/* ── Ficha da OP ── */
function formatarQtdeFicha(v){
  if(v===null||v===undefined||v==='') return '—';
  const n=Number(v);
  if(isNaN(n)) return escapeHtml(v);
  return n.toLocaleString('pt-BR',{maximumFractionDigits:4});
}
function abrirFicha(opNum){
  const det=detalhesOP[opNum];
  const conteudo=document.getElementById('conteudoFicha');
  if(!det){
    conteudo.innerHTML=`
      <div class="ficha-topo">
        <div><div class="marca-ficha">🌿 Supra Ervas</div><div class="subtitulo">Ficha da OP</div></div>
        <button class="ficha-fechar" onclick="fecharFicha()">✕</button>
      </div>
      <div class="ficha-aviso">⚠️ OP <b>${escapeHtml(opNum)}</b> sem detalhe carregado.<br>Importe o Relatório_OP_Aberto.xlsx.</div>`;
    document.getElementById('overlayFicha').classList.add('ativo');
    return;
  }
  const finalizado=normalizar(det.situacao).includes('finalizad')&&!normalizar(det.situacao).includes('nao')&&!normalizar(det.situacao).includes('não');
  const grupos={};
  (det.materiais||[]).forEach(m=>{ const g=m.grupo||'Outros'; if(!grupos[g]) grupos[g]=[]; grupos[g].push(m); });
  const gruposHtml=Object.keys(grupos).map(grupo=>`
    <div class="ficha-grupo">
      <div class="titulo-grupo">${escapeHtml(grupo)}</div>
      <table class="ficha-tabela">
        <thead><tr><th>Matéria-Prima</th><th>Lote</th><th>Venc.</th><th style="text-align:right;">Qtde</th></tr></thead>
        <tbody>${grupos[grupo].map(m=>`
          <tr>
            <td>${escapeHtml(m.materia)}</td>
            <td>${escapeHtml(m.lote)||'—'}</td>
            <td>${escapeHtml(m.vencimento)||'—'}</td>
            <td class="num">${formatarQtdeFicha(m.qtde)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`).join('');
  conteudo.innerHTML=`
    <div class="ficha-topo">
      <div><div class="marca-ficha">🌿 Supra Ervas</div><div class="subtitulo">Ficha da OP</div></div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="op-box"><div class="rotulo">Nº OP</div><div class="valor">${escapeHtml(det.codigo)}</div></div>
        <button class="ficha-fechar" onclick="fecharFicha()">✕</button>
      </div>
    </div>
    <div class="ficha-info">
      <div class="ficha-grid-info">
        <div class="ficha-campo"><div class="rotulo">Situação</div><div class="valor">
          <span style="display:inline-flex;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;background:${finalizado?'rgba(140,255,111,.14)':'rgba(255,201,77,.14)'};color:${finalizado?'var(--final)':'var(--hall)'};">${finalizado?'Finalizado':'Não Finalizado'}</span>
        </div></div>
        <div class="ficha-campo"><div class="rotulo">Data de Emissão</div><div class="valor">${escapeHtml(det.data)||'—'}</div></div>
        <div class="ficha-campo"><div class="rotulo">Lote do Produto</div><div class="valor">${escapeHtml(det.lote_produto)||'—'}</div></div>
        <div class="ficha-campo"><div class="rotulo">Validade</div><div class="valor">${escapeHtml(det.vencimento_produto)||'—'}</div></div>
      </div>
    </div>
    <div class="ficha-produto">
      <div>
        <div class="nome">${escapeHtml(det.cod_produto)} — ${escapeHtml(det.descricao)}</div>
        <div class="grupo">${escapeHtml(det.grupo_produto)} · ${escapeHtml(det.subgrupo_produto)}</div>
      </div>
      <div>
        <div class="qtde-valor">${formatarQtdeFicha(det.quantidade)}</div>
        <div class="qtde-rotulo">Qtde a Produzir</div>
      </div>
    </div>
    <div class="ficha-materiais">
      <h3>Matéria-Prima (${(det.materiais||[]).length} itens)</h3>
      ${gruposHtml||'<div style="color:var(--cinza-400);font-size:13px;">Nenhum item registrado.</div>'}
    </div>`;

function fecharFicha(){ document.getElementById('overlayFicha').classList.remove('ativo'); }

/* ══════════════════════════════════════════════════════════
   BUSCA GLOBAL DE OP (por número ou parte da descrição)
   ══════════════════════════════════════════════════════════ */
function construirCatalogo(porGrupo){
  const cat = [
    ...hall.map(o => ({ op:o.op, nome:o.descricao, status:'Hall', corStatus:'var(--hall)', bgStatus:'var(--hall-bg)', linha:'Aguardando início' }))
  ];
  etapasGrupos.forEach((g,i) => {
    porGrupo[i].forEach(o => cat.push({
      op:o.op, nome:o.descricao, status:rotuloGrupo(i),
      corStatus:COR_GRUPO[i%COR_GRUPO.length], bgStatus:COR_GRUPO_HEX[i%COR_GRUPO_HEX.length]+'22',
      linha:`Etapa ${i+1} de ${etapasGrupos.length}`
    }));
  });
  finalizadas.forEach(o => cat.push({ op:o.op, nome:o.produto, status:'Finalizada', corStatus:'var(--final)', bgStatus:'var(--final-bg)', linha:'Concluída hoje' }));
  catalogo = cat;
}
function abrirBusca(){
  document.getElementById('overlayBusca').classList.add('ativo');
  const input = document.getElementById('buscaInput');
  input.value = '';
  document.getElementById('buscaContador').textContent = '';
  document.getElementById('buscaResultados').innerHTML = '<div class="busca-vazio">Digite o número da OP ou parte da descrição para buscar.</div>';
  setTimeout(() => input.focus(), 50);
}
function fecharBusca(){ document.getElementById('overlayBusca').classList.remove('ativo'); }
function executarBusca(){
  const termoOriginal = document.getElementById('buscaInput').value.trim();
  const contador = document.getElementById('buscaContador');
  const el = document.getElementById('buscaResultados');
  if(!termoOriginal){
    contador.textContent = '';
    el.innerHTML = '<div class="busca-vazio">Digite o número da OP ou parte da descrição para buscar.</div>';
    return;
  }
  const termo = normalizar(termoOriginal);
  const resultados = catalogo.filter(o => normalizar(o.op).includes(termo) || normalizar(o.nome).includes(termo));
  if(!resultados.length){
    contador.textContent = '';
    el.innerHTML = `<div class="busca-vazio">Nenhuma OP encontrada para "${escapeHtml(termoOriginal)}".</div>`;
    return;
  }
  contador.textContent = `${resultados.length} resultado${resultados.length > 1 ? 's' : ''} · clique para focar no painel`;
  el.innerHTML = resultados.map(o => `
    <div class="busca-item" style="--cor-status:${o.corStatus};--bg-status:${o.bgStatus};" onclick="selecionarResultadoBusca('${escapeAttr(o.op)}')">
      <div class="info">
        <div class="op-nome">
          <span class="op-num">OP ${escapeHtml(o.op)}</span>
          <span class="nome">${escapeHtml(o.nome || '(sem descrição)')}</span>
        </div>
        <div class="linha-info">${escapeHtml(o.linha)}</div>
      </div>
      <span class="busca-badge">${escapeHtml(o.status)}</span>
    </div>`).join('');
}
function selecionarResultadoBusca(op){
  const alvo = catalogo.find(o => String(o.op) === String(op));
  filtroAtivo = {
    op, nome: alvo ? alvo.nome : '', status: alvo ? alvo.status : '',
    corStatus: alvo ? alvo.corStatus : 'var(--hall)'
  };
  fecharBusca();
  renderTudo();
}
function limparFiltro(){ filtroAtivo = null; renderTudo(); }

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ fecharBusca(); fecharFicha(); }
  if(e.key === '/' && !document.getElementById('overlayBusca').classList.contains('ativo') && document.activeElement.tagName !== 'INPUT'){
    e.preventDefault();
    abrirBusca();
  }
});

/* ── Gauges de OEE (mesma lógica visual do TV Monster) ── */
function polarPt(cx, cy, r, angDeg){ const rad=(angDeg*Math.PI)/180; return {x:cx+r*Math.cos(rad), y:cy-r*Math.sin(rad)}; }
function arcPath(cx, cy, r, angIni, angFim){
  const p1=polarPt(cx,cy,r,angIni), p2=polarPt(cx,cy,r,angFim);
  const largeArc=(angIni-angFim)>180?1:0;
  return `M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} A ${r} ${r} 0 ${largeArc} 1 ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
}
function gaugeSVG(valor){
  const cx=70, cy=74, r=58;
  const semDado = valor===null || valor===undefined || isNaN(valor);
  const bandas = [{de:180,ate:120,cor:'#EF4444'},{de:120,ate:60,cor:'#F59E0B'},{de:60,ate:0,cor:'#22C55E'}];
  const bandasHtml = bandas.map(b=>`<path d="${arcPath(cx,cy,r,b.de,b.ate)}" stroke="${b.cor}" stroke-width="13" fill="none" opacity="${semDado?0.35:1}"/>`).join('');
  if(semDado){
    return `<svg viewBox="0 0 140 90">${bandasHtml}<circle cx="${cx}" cy="${cy}" r="4.5" fill="#75897E"/>
      <text x="${cx}" y="${cy-6}" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="800" fill="#75897E">--</text></svg>`;
  }
  const v = Math.max(0, Math.min(100, Number(valor)||0));
  const angAgulha = 180-(v/100)*180;
  const pAgulha = polarPt(cx,cy,42,angAgulha);
  const cor = v>=66?'#16A34A':(v>=33?'#D97706':'#DC2626');
  return `<svg viewBox="0 0 140 90">
    ${bandasHtml}
    <line x1="${cx}" y1="${cy}" x2="${pAgulha.x.toFixed(1)}" y2="${pAgulha.y.toFixed(1)}" stroke="#EAF3EC" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4.5" fill="#EAF3EC"/>
    <text x="${cx}" y="${cy-6}" text-anchor="middle" font-family="Segoe UI, Arial" font-size="19" font-weight="800" fill="${cor}">${v.toFixed(0)}%</text>
  </svg>`;
}
function gaugeCard(titulo, valor){
  return `<div class="gauge-card"><div class="gauge-titulo">${escapeHtml(titulo)}</div>${gaugeSVG(valor)}</div>`;
}
function renderOeeDashboard(oeeStats){
  const m7 = (oeeStats && oeeStats.medio7dias) || [];
  const hj = (oeeStats && oeeStats.hoje) || [];
  document.getElementById('oeeLinhaMedia').innerHTML = etapasGrupos.map((g,i) =>
    gaugeCard(`${ICONE_GRUPO[i%ICONE_GRUPO.length]} ${rotuloGrupo(i)}`, m7[i])).join('');
  document.getElementById('oeeLinhaHoje').innerHTML = etapasGrupos.map((g,i) =>
    gaugeCard(`${ICONE_GRUPO[i%ICONE_GRUPO.length]} ${rotuloGrupo(i)}`, hj[i])).join('');
}

/* ── Auto-scroll de listas longas (igual TV Monster) ── */
const autoScrollState = {};
function pararAutoScroll(containerId){
  if(autoScrollState[containerId]){ cancelAnimationFrame(autoScrollState[containerId].rafId); delete autoScrollState[containerId]; }
}
function iniciarAutoScrollSeNecessario(containerId, velocidade){
  pararAutoScroll(containerId);
  const el = document.getElementById(containerId);
  if(!el) return;
  requestAnimationFrame(() => {
    if(el.scrollHeight <= el.clientHeight + 2){ el.scrollTop = 0; return; }
    const qtdeItens = el.children.length;
    if(qtdeItens <= 1){ el.scrollTop = 0; return; }
    el.innerHTML = el.innerHTML + el.innerHTML;
    const metade = el.scrollHeight / 2;
    let pos = 0;
    function passo(){
      pos += (velocidade || 0.25);
      if(pos >= metade) pos = 0;
      el.scrollTop = pos;
      autoScrollState[containerId] = { rafId: requestAnimationFrame(passo) };
    }
    autoScrollState[containerId] = { rafId: requestAnimationFrame(passo) };
  });
}

/* ── Renderização do quadro ── */
function renderTudo(){
  const porGrupo = etapasGrupos.map(() => []);
  emProducao.forEach(o => {
    let idx = indiceDoGrupo(o.etapa);
    if(idx === -1) idx = 0;
    porGrupo[idx].push(o);
  });
  renderOeeDashboard(oeeStats);
  construirCatalogo(porGrupo);
  if(document.getElementById('overlayBusca').classList.contains('ativo')) executarBusca();
  aplicarFiltro(porGrupo);
}

function aplicarFiltro(porGrupoTotal){
  const banner = document.getElementById('filtroBanner');
  let hallF = hall, finalizadasF = finalizadas;
  let porGrupo = porGrupoTotal;

  if(filtroAtivo){
    banner.style.setProperty('--cor-status', filtroAtivo.corStatus || 'var(--hall)');
    document.getElementById('filtroTexto').innerHTML =
      `🔎 Mostrando só a <b>OP ${escapeHtml(filtroAtivo.op)}</b> — ${escapeHtml(filtroAtivo.nome || '(sem descrição)')} <span style="opacity:.65;">(${escapeHtml(filtroAtivo.status)})</span>`;
    banner.classList.add('ativo');
    const opAlvo = String(filtroAtivo.op);
    hallF = hall.filter(o => String(o.op) === opAlvo);
    finalizadasF = finalizadas.filter(o => String(o.op) === opAlvo);
    porGrupo = porGrupoTotal.map(lista => lista.filter(o => String(o.op) === opAlvo));
  } else {
    banner.classList.remove('ativo');
  }

  renderPipelineBar(porGrupo, hallF, finalizadasF);
  renderBoard(porGrupo, hallF, finalizadasF);
}

function renderPipelineBar(porGrupo, hallF, finalizadasF){
  const el = document.getElementById('pipelineBar');
  let html = `<div class="pilula" style="--cor-pilula:var(--hall);--bg-pilula:var(--hall-bg);">📋 Hall <span class="n">${hallF.length}</span></div><span class="pilula-seta">›</span>`;
  etapasGrupos.forEach((g, i) => {
    const cor = COR_GRUPO[i % COR_GRUPO.length];
    const bg = COR_GRUPO_BG_HEX[i % COR_GRUPO_BG_HEX.length];
    html += `<div class="pilula" style="--cor-pilula:${cor};--bg-pilula:${bg};">${ICONE_GRUPO[i%ICONE_GRUPO.length]} ${escapeHtml(rotuloGrupo(i))} <span class="n">${porGrupo[i].length}</span></div><span class="pilula-seta">›</span>`;
  });
  html += `<div class="pilula" style="--cor-pilula:var(--final);--bg-pilula:var(--final-bg);">✅ Finalizadas <span class="n">${finalizadasF.length}</span></div>`;
  el.innerHTML = html;
}

function renderColunaEtapa(i, porGrupo){
  const grupo = etapasGrupos[i];
  const cor = COR_GRUPO[i % COR_GRUPO.length];
  const corHex = COR_GRUPO_HEX[i % COR_GRUPO_HEX.length];
  const bgHex = COR_GRUPO_BG_HEX[i % COR_GRUPO_BG_HEX.length];
  const icone = ICONE_GRUPO[i % ICONE_GRUPO.length];
  const lista = porGrupo[i];
  const containerId = 'listaEtapa' + i;
  return `<div class="coluna">
      <div class="coluna-pill" style="--cor-pilula:${cor};--bg-pilula:${bgHex};">${icone} ${escapeHtml(rotuloGrupo(i))} <span class="n">${lista.length}</span><span class="sub">Etapa ${i+1}/${etapasGrupos.length}</span></div>
      <div class="lista" id="${containerId}">
        ${lista.length ? lista.map(o => {
          const temParada = !!o.paradaMotivo;
          return `
          <div class="item${temParada ? ' com-parada-ativa' : ''}" style="--cor-item:${corHex};" onclick="abrirFicha('${escapeAttr(o.op)}')">
            ${grupo.length > 1 ? `<span class="badge-etapa-real" style="background:${corHex};">${escapeHtml(o.etapa)}</span>` : ''}
            <div class="linha1"><span class="op">OP ${escapeHtml(o.op)}</span><span class="data-emissao">${escapeHtml(o.dataEmissao)}</span></div>
            <span class="nome">${escapeHtml(o.descricao||'(sem descrição)')}</span>
            <div class="nivel-garrafa">
              <div class="nivel-legenda"><span>Progresso</span><span>${i+1}/${etapasGrupos.length}</span></div>
              <div class="nivel-trilho"><div class="nivel-liquido" style="width:${Math.round(((i+1)/etapasGrupos.length)*100)}%;background:${corHex};"></div></div>
            </div>
            <div class="meta"><span>Cód. <b>${escapeHtml(o.codProduto)}</b></span><span>Qtde <b>${escapeHtml(o.qtde)}</b></span></div>
            ${temParada ? blocoParadaAtiva(o.paradaMotivo, o.paradaRegistradaEm) : ''}
            <a class="btn btn-registrar" style="background:${corHex};" href="${FORM_URL}" target="_blank" onclick="event.stopPropagation()">📋 Registrar ${escapeHtml(rotuloGrupo(i))}</a>
            <button class="btn-devolver" onclick="event.stopPropagation();devolverHall('${escapeAttr(o.op)}')">↩ Devolver ao Hall</button>
          </div>`;
        }).join('') : `<div class="vazio">Nenhuma OP em ${escapeHtml(rotuloGrupo(i))}.</div>`}
      </div>
    </div>`;
}

function renderBoard(porGrupo, hallF, finalizadasF){
  const el = document.getElementById('boardScroll');
  let html = '';

  // HALL
  html += `<div class="coluna">
    <div class="coluna-pill" style="--cor-pilula:var(--hall);--bg-pilula:var(--hall-bg);">📋 Hall <span class="n">${hallF.length}</span><span class="sub">Aguardando início</span></div>
    <div class="lista" id="listaHall">
      ${hallF.length ? hallF.map(o => `
        <div class="item" style="--cor-item:#FFC94D;" onclick="abrirFicha('${escapeAttr(o.op)}')">
          <div class="linha1"><span class="op" style="color:var(--hall);">OP ${escapeHtml(o.op)}</span><span class="data-emissao">${escapeHtml(o.dataEmissao)}</span></div>
          <span class="nome">${escapeHtml(o.descricao||'(sem descrição)')}</span>
          <div class="meta"><span>Cód. <b>${escapeHtml(o.codProduto)}</b></span><span>Qtde <b>${escapeHtml(o.qtde)}</b></span></div>
          <button class="btn btn-avancar" onclick="event.stopPropagation();iniciarProducao('${escapeAttr(o.op)}')">▶ Iniciar Produção</button>
        </div>`).join('') : '<div class="vazio">Nenhuma OP pendente.<br>Importe um arquivo acima.</div>'}
    </div>
  </div>`;

  if(etapasGrupos.length === 5){
    html += `<div class="coluna-dupla">${renderColunaEtapa(0,porGrupo)}${renderColunaEtapa(2,porGrupo)}</div>`;
    html += `<div class="coluna-dupla">${renderColunaEtapa(1,porGrupo)}${renderColunaEtapa(3,porGrupo)}</div>`;
    html += renderColunaEtapa(4,porGrupo);
  } else {
    etapasGrupos.forEach((g,i) => { html += renderColunaEtapa(i,porGrupo); });
  }

  // FINALIZADAS
  html += `<div class="coluna">
    <div class="coluna-pill" style="--cor-pilula:var(--final);--bg-pilula:var(--final-bg);">✅ Finalizadas <span class="n">${finalizadasF.length}</span><span class="sub">Hoje</span></div>
    <div class="lista" id="listaFinalizadas">
      ${finalizadasF.length ? finalizadasF.slice().reverse().map(o => `
        <div class="item" style="--cor-item:#8CFF6F;" onclick="abrirFicha('${escapeAttr(o.op)}')">
          <div class="linha1"><span class="op" style="color:var(--final);">OP ${escapeHtml(o.op)}</span><span class="tag-concluida">✔ Concluída</span></div>
          <span class="nome">${escapeHtml(o.produto||'(sem descrição)')}</span>
          <div class="meta"><span>Produzido <b>${escapeHtml(o.produzido)}</b></span><span>Perda <b>${escapeHtml(o.perda_processo||'0')}</b></span></div>
        </div>`).join('') : '<div class="vazio">Nenhuma OP finalizada hoje.</div>'}
    </div>
  </div>`;

  el.innerHTML = html;

  const idsListas = ['listaHall', ...etapasGrupos.map((g,i)=>'listaEtapa'+i), 'listaFinalizadas'];
  idsListas.forEach(id => iniciarAutoScrollSeNecessario(id));
}

/* ── Init ── */
carregarDoSheet();
setInterval(carregarDoSheet, 20000);
</script>
</body>
